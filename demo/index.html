<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Windows 锁屏 · 桌面挂件 — 交互 Demo</title>
<style>
@font-face{font-family:"D-DIN";src:url("../images/D-DIN.ttf") format("truetype");font-weight:400;font-display:block}
@font-face{font-family:"D-DIN";src:url("../images/D-DIN-Bold.ttf") format("truetype");font-weight:700;font-display:block}

:root{
  --win-text:#FFFFFF;
  --win-dim:#FFFFFFC4;
  --win-faint:#FFFFFF8F;
  --win-line:#FFFFFF29;
  --glass:#0000004D;
  --glass-stroke:#FFFFFF24;
  --font-cn:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --font-num:"D-DIN","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 120% at 50% 0%,#161C24 0%,#0A0D12 60%,#07090D 100%);
  color:#fff;font-family:var(--font-cn);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.ico{display:block;flex:none}

/* ---------- shell ---------- */
#stage{position:relative;width:1600px;height:1000px;transform-origin:center center;
  border-radius:16px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06)}
.screen{position:absolute;inset:0;width:1600px;height:1000px;overflow:hidden;background:#0C1016;
  opacity:0;pointer-events:none;transition:opacity .26s ease}
.screen.on{opacity:1;pointer-events:auto}

.shell-bar{position:fixed;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:16px;
  padding:0 24px;z-index:50;pointer-events:none}
.shell-bar>*{pointer-events:auto}
.brand{font-size:13px;color:#FFFFFF8F;letter-spacing:.02em}
.brand b{color:#fff;font-weight:500}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(12px)}
.seg button{height:30px;padding:0 16px;border-radius:999px;font-size:12.5px;color:#FFFFFFB8;transition:.16s}
.seg button:hover{color:#fff}
.seg button.on{background:rgba(255,255,255,.16);color:#fff}
.hint{position:fixed;left:0;right:0;bottom:18px;text-align:center;font-size:12px;color:#FFFFFF5C;z-index:50;
  pointer-events:none;font-family:var(--font-cn)}
.hint kbd{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);border-radius:4px;
  padding:1px 5px;font-family:var(--font-num);font-size:11px;color:#FFFFFF8F}

/* ---------- wallpaper layers ---------- */
.wp{position:absolute;left:0;top:0;width:1600px;height:1000px;background-size:cover;background-position:center;
  transition:opacity .35s ease}
.wp video{position:absolute;left:0;top:0;width:1600px;height:1000px;object-fit:cover;display:block}
.scrim{position:absolute;left:0;top:520px;width:1600px;height:480px;
  background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,.35) 32%,rgba(0,0,0,.72) 64%,rgba(0,0,0,.93) 100%)}

/* ---------- glass primitives ---------- */
.glass{background:var(--glass);border:1px solid var(--glass-stroke)}
.blur12{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pill{height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:13px;color:#fff;box-shadow:0 8px 26px rgba(0,0,0,.10);transition:background .16s,border-color .16s}
.pill:hover{background:#00000059;border-color:#FFFFFF3D}
/* box-sizing:border-box + 1px 描边会吃掉 2px；设计稿里描边画在内部，
   所以左右 padding 用 19（= 设计的 20 - 描边 1），内容宽回到 282 / 310 */
.card{width:322px;height:126px;border-radius:20px;padding:16px 19px;
  display:flex;flex-direction:column;justify-content:space-between}

/* ---------- lock screen ---------- */
.lock-time{position:absolute;left:672px;top:260px;width:256px;height:172px;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.t-hour{font-family:var(--font-num);font-size:128px;font-weight:200;line-height:1;letter-spacing:-.01em;color:#fff}
.t-date{font-family:var(--font-num);font-size:26px;color:var(--win-dim)}

/* A1x0f 右上操作区：**默认隐藏**，只有在光标有动作时才浮现；
   光标静止 3s 后重新隐去（光标停在操作区上、或「设为 …」菜单开着时不倒计时）。
   只做淡入淡出，不做位移。
   容器自身透明、无描边，只负责定位。这圈 padding 是**看不见的安全边** ——
   三枚胶囊只有 38px 高、显示切换只有 47px 宽，贴着它点偏几像素就落到壁纸上，
   而锁屏「点空白 = 退出锁屏」，所以：左 / 下各留 12px 余量，
   上 / 右一直铺到画布边缘（20px）—— 右上角整块都是操作区，不是「空白」。
   （内容仍在 1283,20，视觉位置一点没动。）
   另外隐身用 opacity 而不是 visibility：胶囊即使隐身也仍然可命中，不会把点击漏给
   下面的壁纸（那正是「点显示切换却退出锁屏」的元凶）；看不见时点它只把整行唤出来。 */
.ops{position:absolute;left:1271px;top:0;padding:20px 20px 12px 12px;display:flex;gap:8px;align-items:center;
  opacity:0;transition:opacity .22s ease}
.ops.on{opacity:1}
#pillToggle{width:47px;padding:0}
/* TKJvj 设为分组：常亮一档，不等 hover（75 = 16 + 43 + 16） */
#pillSet{width:75px;padding:0;background:#00000059;border-color:#FFFFFF3D}
#pillSet:hover{background:#00000066;border-color:#FFFFFF4D}
#pillMore{padding:0 11px 0 6px;gap:10px}
.stack{position:relative;width:60px;height:26px}
.stack i{position:absolute;top:0;width:26px;height:26px;border-radius:999px;background-size:cover;
  background-position:center;box-shadow:inset 0 0 0 1px #FFFFFF3D;overflow:hidden}
.stack i:nth-child(1){left:0}
.stack i:nth-child(2){left:17px}
.stack i:nth-child(3){left:34px}
/* 叠影 = 三张动态壁纸（与「热门壁纸」同一组）。静止时是三张封面静帧，
   hover 后**三格同时播放**，移开全部暂停并落回封面 */
.stack video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity .18s ease}
.stack.on video{opacity:1}
.more-label{display:flex;align-items:center;gap:4px}
.more-label .ico{color:#FFFFFFA6}

.menu{position:absolute;left:1338px;top:66px;width:max-content;min-width:113px;padding:6px;border-radius:20px;
  display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 26px rgba(0,0,0,.10);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.menu.on{opacity:1;transform:translateY(0);pointer-events:auto}
.menu button{height:34px;border-radius:10px;padding:0 12px;gap:10px;display:flex;align-items:center;
  font-size:13px;color:#fff;transition:background .14s,border-radius .14s}
.menu button span{white-space:nowrap}
.menu button .ico{color:#FFFFFFC4;transition:color .14s}
/* 悬停态 = Wnfn4：底色 #FFFFFF1F + 圆角 16 + 图标转白（默认不预高亮） */
.menu button:hover{background:#FFFFFF1F;border-radius:16px}
.menu button:hover .ico{color:#FFFFFF}

.widgets{position:absolute;left:301px;top:750px;width:998px;height:126px;display:flex;gap:16px}
.w-head{display:flex;align-items:center;gap:6px;height:19px}
.w-head .ico{color:var(--win-dim)}
.w-head h3{font-size:14px;font-weight:500;color:var(--win-text)}
/* BMgDr 今日精选：标题行右侧的胶囊入口（21 = 4 + 13 + 4） */
.rank-head{display:flex;align-items:center;justify-content:space-between;height:21px}
.w-chip{height:21px;padding:4px 8px;border-radius:999px;background:#FFFFFF1F;font-size:10px;color:var(--win-dim);
  display:flex;align-items:center;flex:none;transition:background .14s,color .14s}
.w-chip:hover{background:#FFFFFF33;color:#fff}
.w-main{display:flex;align-items:center;justify-content:space-between}
.w-left{display:flex;align-items:center;gap:6px}
.w-ico{position:relative;width:52px;height:52px}
.w-ico svg{position:absolute}
.w-temp{display:flex;align-items:flex-start;gap:2px;padding-top:8px}
.w-num{font-family:var(--font-num);font-size:44px;line-height:1;color:#fff;font-feature-settings:"tnum"}
.w-unit{font-family:var(--font-num);font-size:14px;font-weight:300;color:#fff}
.w-desc{display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding-top:8px}
.w-desc span:first-child{font-size:14px;color:#fff}
.w-range{font-family:var(--font-num);font-size:12.5px;color:var(--win-dim)}

.cal-head{display:flex;align-items:center;justify-content:space-between;height:22px}
.cal-title{display:flex;align-items:center;gap:6px;font-family:var(--font-num);font-size:14px;font-weight:500}
.cal-title .ico{color:var(--win-dim)}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:22px;height:22px;border-radius:999px;background:#FFFFFF1F;display:grid;place-items:center;
  color:var(--win-dim);transition:background .14s,color .14s}
.cal-nav button:hover{background:#FFFFFF33;color:#fff}
.cal-week{display:flex;gap:4px;align-items:center;justify-content:center}
.cal-day{width:37px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cal-day .dow{font-size:10.5px;color:var(--win-faint)}
.cal-day .num{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  font-family:var(--font-num);font-size:14.5px;color:#fff}
.cal-day.today .num{background:#FFFFFF1F;border-radius:999px}

.rank{display:flex;gap:6px;height:56px}
.rank-tile{width:90px;height:56px;border-radius:12px;position:relative;overflow:hidden;display:block;
  padding:0;background:none}
/* 悬停只让图从内部轻轻放大，不加阴影也不位移 */
.rank-img{position:absolute;inset:0;background-size:cover;background-position:center;
  transition:transform .34s cubic-bezier(.22,.61,.36,1)}
.rank-tile:hover .rank-img{transform:scale(1.09)}
/* 悬停时在封面之上淡入真实影片：预告这张壁纸是动的 */
.rank-vid{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transform:scale(1.09);transition:opacity .22s ease;pointer-events:none}
.rank-tile:hover .rank-vid{opacity:1}
.rank-chip{position:absolute;left:7px;top:7px;width:18px;height:18px;border-radius:999px;background:#0000008A;
  display:grid;place-items:center;font-family:var(--font-num);font-size:10.5px;color:#fff}

/* ---------- desktop ---------- */
.dicons{position:absolute;left:20px;top:40px;display:flex;flex-direction:column;gap:23px}
.dicon{width:88px;display:flex;flex-direction:column;align-items:center;gap:8px}
.dtile{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;
  box-shadow:0 2px 6px #0000004D}
.dlabel{font-size:12.5px;line-height:17px;color:#fff;text-shadow:0 1px 3px #000000B3}

.taskbar-topline{position:absolute;left:0;top:944px;width:1600px;height:1px;background:#FFFFFF24}
.taskbar{position:absolute;left:0;top:944px;width:1600px;height:56px;background:#080C11C7;
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.apps{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;gap:4px}
.app{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;position:relative}
.app.active{background:#FFFFFF14}
.app-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;
  box-shadow:0 1px 3px #00000040}
.app-run{position:absolute;left:12px;bottom:2px;width:16px;height:3px;border-radius:2px;background:#FFFFFFB8}

.tray{position:absolute;right:16px;top:12px;height:32px;display:flex;align-items:center;gap:4px;
  cursor:default;user-select:none}   /* G7FiM 系统托盘：只展示，无 hover / 无按压 / 不可聚焦 */
.tray .tray-item{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:#FFFFFFD9}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding:0 10px;line-height:1.1}
.clock .t{font-family:var(--font-num);font-size:13px;color:#fff}
.clock .d{font-family:var(--font-num);font-size:11px;color:#FFFFFFA6}

/* ---------- wallpaper assistant ---------- */
.assist{position:absolute;left:1200px;top:68px;width:380px;height:auto;border-radius:20px;z-index:20;
  padding:16px 19px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 26px rgba(0,0,0,.35);
  transition:opacity .18s ease,transform .18s ease,visibility 0s}
/* 壁纸助手挂件（llYsS）不是默认状态：右上角壁纸入口（T5sB3w）hover 后才展开 */
.assist.hide{opacity:0;transform:translateY(-6px);visibility:hidden;
  transition:opacity .18s ease,transform .18s ease,visibility 0s .18s}
.a-list{display:flex;flex-direction:column;gap:8px}
.a-row{border-radius:12px;display:flex;align-items:center}
.a-carousel{height:56px;background:#FFFFFF1F;padding:0 10px;gap:10px;justify-content:space-between}
.a-thumb{display:block;width:36px;height:36px;border-radius:8px;background-size:cover;background-position:center;flex:none}
.a-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;text-align:left}
.a-text .n,.a-text .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-text .n{font-size:13px;color:#fff}
.a-text .s{font-size:11px;color:var(--win-dim)}
.a-ctl{display:flex;align-items:center;gap:8px;flex:none}
/* 两枚圆形按钮共用样式：静音（a-mute）与视频开关（a-vpause）；
   两者的「关闭」态都用同一套斜杠图标（volume-off / video-off，同为 Lucide 的 m2 2 20 20），
   斜杠从左下贯到右上，比原来的 volume-x 叉号语义更统一；默认暗底，激活时亮底 */
.a-mute,.a-vpause{width:24px;height:24px;border-radius:6px;background:#FFFFFF29;display:grid;place-items:center;color:#fff;
  transition:background .14s}
.a-mute.on,.a-vpause.on{background:#FFFFFF29}
.a-mute:not(.on),.a-vpause:not(.on){background:#FFFFFF1F;color:var(--win-dim)}
/* 关闭动态壁纸（静态壁纸）时：轮播行照常展示、文案不变（说明是通用文案），
   只是没有音轨（静音）、也没有视频可开关（a-vpause）—— 连分隔一起收起，
   控制行只剩 上一张 / 暂停轮播 / 下一张（对应画板静态态 w9LXrI） */
.assist.static-wp .a-mute,.assist.static-wp .a-vpause,.assist.static-wp .a-div-v{display:none}
.a-div-v{width:1px;height:16px;background:#FFFFFF29}
.a-nav{display:flex;gap:6px}
.a-nav button{width:24px;height:24px;border-radius:6px;background:#FFFFFF1F;display:grid;place-items:center;
  color:var(--win-dim);transition:background .14s,color .14s}
.a-nav button:hover{background:#FFFFFF33;color:#fff}
.a-sub{display:flex;flex-direction:column;gap:2px}
.a-sub button{height:32px;border-radius:8px;padding:0 8px;gap:10px;display:flex;align-items:center;
  font-size:13px;color:#fff;transition:background .14s}
.a-sub button:hover{background:#FFFFFF14}
.a-sub .ico{color:var(--win-dim)}
/* k2boA 唤起屏保：行尾的 Ctrl + L 键帽，与画板同参数（#FFFFFF1F / r5 / 高 20 / 内边距 0 6 / 11px） */
.a-sub .kbd{height:20px;padding:0 6px;border-radius:5px;background:#FFFFFF1F;color:var(--win-dim);
  font-size:11px;font-family:var(--font-cn);display:flex;align-items:center;flex:none}
.a-rule{height:1px;background:#FFFFFF1F}
/* TQO4T 壁纸频道：整行只是标题，不可点、无 hover —— 只有右侧「查看更多」胶囊可点 */
.a-channel{height:32px;padding:0 8px;justify-content:space-between}
.a-channel .left{display:flex;align-items:center;gap:10px}
.a-channel .left .ico{color:var(--win-dim)}
.a-channel .left span{font-size:13px;color:#fff}
.a-chip{height:25px;padding:5px 10px;border-radius:999px;background:#FFFFFF1F;font-size:11px;color:var(--win-dim);
  display:flex;align-items:center;cursor:pointer;transition:background .14s,color .14s}
.a-chip:hover{background:#FFFFFF33;color:#fff}
/* rjDsr + MBuYL 排行榜：与锁屏「热门壁纸」同款 —— 三格横排 + 排名角标（不是竖排列表）
   六张动态壁纸排成两行，每行三格 */
.a-rank-wrap{display:flex;flex-direction:column;gap:6px}
.a-rank{display:flex;gap:6px;height:56px}
.a-rank .rank-tile{flex:1;width:auto}
.pro{display:flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;
  background:#FFFFFF1F;border:1px solid #FFFFFF24;font-size:10px;font-weight:500;color:#fff;flex:none}
.pro .ico{color:#FFD358}
.dyn{display:flex;align-items:center;gap:3px;height:20px;padding:0 8px;border-radius:999px;
  background:#FFFFFF1F;font-size:10px;font-weight:500;color:#FFFFFFD9;flex:none}

/* yKmw8：壁纸库窗口。设计里是 1060×680 @ 270,160，r6，无阴影。
   唤起分两拍：先弹出启动页（splash），再放大到最终尺寸并露出内容。
   窗口内部是两个互斥的视图：app-lib（壁纸库首页）/ app-detail（单张壁纸的详情页） */
.desk-app{position:absolute;left:270px;top:160px;width:1060px;height:680px;border-radius:6px;overflow:hidden;z-index:10;
  opacity:0;transform:scale(.955);transform-origin:50% 58%;pointer-events:none;
  transition:opacity .2s ease,transform .3s cubic-bezier(.2,.9,.25,1)}
.desk-app.launching{opacity:1;transform:scale(.986)}
.desk-app.on{opacity:1;transform:scale(1);pointer-events:auto}
.app-view{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;
  transition:opacity .26s ease;background-size:cover;background-position:center;background-repeat:no-repeat}
.app-view.on{opacity:1}
/* 关键：子级 pointer-events:auto 会覆盖父级 .desk-app 的 none —— 窗口明明没打开，
   却仍然拦住锁屏底部的点击（今日精选 BMgDr / 热门壁纸缩略图）。
   所以「可交互」必须绑定「窗口已打开」，不能只看视图自身。 */
.desk-app.on .app-view.on{pointer-events:auto}

/* 详情页（w7MSg）：底图就是设计稿本身，只把「会变的地方」用绝对定位盖住重建 */
.d-title{position:absolute;left:226px;top:86px;width:360px;height:38px;background:#FFFFFF;
  display:flex;align-items:center;gap:8px}
.d-title .vb{width:17px;height:17px;border-radius:5px;background:linear-gradient(135deg,#FFA25C,#FF5A1F);
  display:grid;place-items:center;color:#FFF;flex:none}
.d-title .n{font-size:16px;font-weight:500;color:#22262B}
.d-preview{position:absolute;left:230px;top:146px;width:579px;height:326px;border-radius:6px;overflow:hidden;
  background-size:cover;background-position:center}
.d-note{position:absolute;left:0;top:0;width:100%;height:46px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#FFFFFFD9;background:linear-gradient(#00000099,#00000000)}
.d-bar{position:absolute;left:0;bottom:0;width:100%;height:58px;display:flex;align-items:center;gap:10px;
  padding:0 16px;background:linear-gradient(#00000000,#000000A6)}
.d-pause{width:12px;height:12px;color:#FFF;flex:none;display:grid;place-items:center}
.d-track{position:relative;flex:1;height:3px;border-radius:2px;background:#FFFFFF4D}
.d-track i{position:absolute;left:0;top:0;height:3px;width:12%;border-radius:2px;background:#FFF}
.d-track b{position:absolute;left:12%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#FFF}
.d-time{font-size:11px;color:#FFFFFFD9;flex:none;font-variant-numeric:tabular-nums}
.d-vol{color:#FFFFFFD9;flex:none;display:grid;place-items:center}
.d-rail{position:absolute;left:830px;top:256px;width:190px;display:flex;flex-direction:column;gap:10px}
.d-card{position:relative;width:190px;height:110px;border-radius:8px;overflow:hidden;
  background-size:cover;background-position:center}
.d-badge{position:absolute;right:10px;top:10px;height:20px;padding:0 8px;border-radius:999px;background:#0000007A;
  color:#FFF;font-size:10px;display:flex;align-items:center}
/* 详情页的「桌面轮播 / 设为桌面」在底图里是位图，这里叠一层透明热区把它变成可点的 */
.d-hit{position:absolute;top:492px;height:37px;border-radius:999px;cursor:pointer}
.app-splash{position:absolute;inset:0;background:#F7F8FA;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;pointer-events:none;transition:opacity .22s ease}
.desk-app.on .app-splash{opacity:0}
.spin{width:28px;height:28px;border-radius:50%;border:2.5px solid #00000012;border-top-color:#0F7BD6;
  animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.app-splash .t{font-size:12.5px;color:#5A6472}

.toggle-pill{position:absolute;left:1533px;top:20px;width:47px;height:38px;border-radius:999px;
  display:grid;place-items:center;color:#fff;box-shadow:0 8px 26px rgba(0,0,0,.10);transition:background .16s,border-color .16s}
.toggle-pill:hover,.toggle-pill.on{background:#00000059;border-color:#FFFFFF3D}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,calc(-50% + 12px));z-index:80;
  padding:10px 16px;border-radius:999px;background:rgba(20,24,30,.86);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(16px);font-size:12.5px;color:#fff;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease}
.toast.on{opacity:1;transform:translate(-50%,-50%)}

/* ============ calendar ============ */
const BASE = new Date(2026,8,9);           // 2026-09-09 星期三 = 今天
const DOW = ['一','二','三','四','五','六','日'];
function weekDays(offset){
  const monday = new Date(BASE);
  monday.setDate(BASE.getDate() - 2 + offset*7);
  return Array.from({length:7},(_,i)=>{
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    return {dow:DOW[i], num:d.getDate(), month:d.getMonth()+1, year:d.getFullYear(),
            today:d.toDateString()===BASE.toDateString()};
  });
}

function renderRank(){
  // 锁屏 · 热门壁纸：设计稿就是三格横排
  $('#rankRow').innerHTML = RANK_LOCK.map((wi,i)=>rankTile(wi,i)).join('');

  // 通用模块，不做静态壁纸差异化 —— 静态态也照旧展示这六张 MP4 的封面
  const list = RANK;

function render(){
  const w = WALLS[state.wall];
  // 关闭动态壁纸：不用动态壁纸，整屏换成**非 MP4 的静态壁纸**
  // （不是拿视频封面充数 —— 那仍然是 MP4 里的一帧）
  const shown = state.dynamic ? w : staticAt(state.staticWall);

  // 壁纸始终保持显示 —— 「显示切换」切的是挂件，不是壁纸
  // 动态壁纸只在「当前可见的一屏」放一个 <video> 铺满，其余情况显示封面静帧
  const activeSel = state.screen === 'lock' ? '#lockWp' : '#deskWp';
  ['#lockWp','#deskWp'].forEach(sel=>{
    const el = $(sel);
    const keepVideo = !!shown.dynamic && state.dynamic && sel === activeSel;
    let v = el.querySelector('video');
    if(!keepVideo){
      if(v) v.remove();
      el.style.backgroundImage = `url("${thumbOf(shown)}")`;
      return;
    }
    el.style.backgroundImage = 'none';
    if(!v){
      v = document.createElement('video');
      v.loop = true; v.muted = true; v.playsInline = true;
      v.setAttribute('playsinline',''); v.setAttribute('muted','');
      el.appendChild(v);
    }
    if(v.getAttribute('src') !== shown.video){ v.setAttribute('src', shown.video);
      v.setAttribute('poster', thumbOf(shown));   // 暂停/未播时也有一帧可见
      v.load(); }
    v.muted = state.muted;                       // 静音按钮直接作用在动态壁纸的音轨上
    // 播放 / 暂停只由 a-vpause（视频开关）决定，与轮播是否停止无关
    if(!state.videoPaused){
      const p = v.play();
      if(p) p.catch(()=>{ v.muted = true; const p2 = v.play(); if(p2) p2.catch(()=>{}); });  // 浏览器拦截带声自动播放时退回静音播放
    } else v.pause();
  });
  $('#lockWidgets').style.visibility = state.widgets ? '' : 'hidden';
  // 桌面 · 壁纸助手挂件（llYsS）不是默认状态，它是右上角壁纸入口（T5sB3w）hover 后展开的；
  // 客户端唤起时同样收起（QNMlM / ia7Oi 里都只有窗口，没有 llYsS）
  const app = $('#deskApp'), detail = state.appView === 'detail', scroll = state.appView === 'scroll';
  // QNMlM / ia7Oi：库页与详情页的右上角也是同一枚壁纸入口，悬停同样展开浮窗，
  // 并且与窗口**同时**可见（浮窗在窗口之上），不再是互斥的
  $('#deskAssist').classList.toggle('hide', !state.assist);
  app.classList.toggle('launching', state.appPhase === 'launching');
  app.classList.toggle('on', state.appPhase === 'open');
  $('#appLib').classList.toggle('on', !detail && !scroll);
  $('#appDetail').classList.toggle('on', detail);
  $('#appScroll').classList.toggle('on', scroll);   // 壁纸轮播设置 = hT1PW 那张设计稿图
  if(detail) renderDetail();

  // thumbs
  $('#aThumb').style.backgroundImage = `url("${thumbOf(shown)}")`;

  // 轮播说明是通用文案（30 分钟自动切换 / 已暂停），跟着 a-stop（暂停轮播）走
  $('#aSub').textContent = state.playing ? '30 分钟自动切换' : '已暂停';


  // 静态壁纸下（关闭动态壁纸）：收起 静音 / 视频开关 / 分隔，上一张 / 暂停轮播 / 下一张照旧
  $('#deskAssist').classList.toggle('static-wp', !state.dynamic);

  // mute
  const m = $('#aMute');
  m.classList.toggle('on', state.muted);
  m.innerHTML = icon(state.muted ? 'volume-off' : 'volume-2', 13);

  // 视频开关（s15bM）：作用在视频本身，暂停后停在当前帧；
  // 用 video / video-off 而不是 play / pause，才不会和轮播那枚的恢复图标撞车
  const vp = $('#aVPause');
  vp.classList.toggle('on', state.videoPaused);
  vp.innerHTML = icon(state.videoPaused ? 'video-off' : 'video', 13);

  // 暂停轮播（e5w4OC）：停的是「30 分钟自动切换」，视频照播
  $('#aStop').innerHTML = icon(state.playing ? 'pause' : 'play', 13);

  // 显示切换：每个界面切换自己的挂件（锁屏 = 小组件行，桌面 = 壁纸助手）
  $('#pillToggle').innerHTML = icon(state.widgets ? 'eye' : 'eye-off', 15);
  // 桌面的显示切换是「壁纸入口」，图标固定 gallery-horizontal-end —— 不是锁屏那枚的 eye
  $('#deskToggle').innerHTML = icon('gallery-horizontal-end', 15);
  $('#deskToggle').classList.toggle('on', !!state.assist);
  $('#subDynamic').innerHTML = icon(state.dynamic ? 'eye-off' : 'play', 16) +
    `<span>${state.dynamic ? '关闭动态壁纸' : '开启动态壁纸'}</span>`;
}

// 锁屏 · 右上操作区（A1x0f）：默认隐身，光标一动才出现，静止后自动隐去
const opsEl = $('.ops');
let opsTimer = null;
const OPS_IDLE = 3000;
function hideOps(){ clearTimeout(opsTimer); opsTimer = null; opsEl.classList.remove('on'); }
function showOps(){
  clearTimeout(opsTimer); opsTimer = null;
  opsEl.classList.add('on');
  // 光标还停在操作区上、Tab 焦点还留在胶囊上、或「设为 …」菜单开着时不倒计时，
  // 否则会把用户正在用的东西抽走
  if(opsEl.matches(':hover') || opsEl.contains(document.activeElement) || menu.classList.contains('on')) return;
  opsTimer = setTimeout(hideOps, OPS_IDLE);
}
['mousemove','mousedown','touchstart','wheel'].forEach(t=>
  document.addEventListener(t, ()=>{ if(state.screen === 'lock') showOps(); }, {passive:true}));
opsEl.addEventListener('mouseenter', ()=> clearTimeout(opsTimer));   // 停在上面就一直留着
opsEl.addEventListener('mouseleave', showOps);                       // 离开 → 重新开始倒计时
opsEl.addEventListener('focusin', showOps);                          // Tab 落到胶囊上 → 同样把操作区亮出来

// 锁屏 · 显示切换（ZC5g7）：显示 / 隐藏锁屏小组件行 —— 和桌面那枚不是同一个功能
$('#pillToggle').addEventListener('click', ()=>{ state.widgets = !state.widgets; render();

let assistTimer;
const openAssist = ()=>{ clearTimeout(assistTimer);
  if(!state.assist){ state.assist = true; render(); } };
const closeAssist = ()=>{ clearTimeout(assistTimer);
  assistTimer = setTimeout(()=>{ if(state.assist && !state.assistPin){ state.assist = false; render(); } }, 180); };
['#deskToggle','#deskAssist'].forEach(s=>{

  el.addEventListener('mouseleave', closeAssist);
});

// hover 入口时**三格同时播放**（各格不再互斥，也不参与 rankRow 的 hoverVid 单例），
// 移开时全部暂停并落回封面静帧。
const stackEl = $('#pillMore').querySelector('.stack');
const stackVids = stackEl ? [...stackEl.querySelectorAll('video')] : [];
if(stackEl){
  $('#pillMore').addEventListener('mouseenter', ()=>{
    stackEl.classList.add('on');

      const p = v.play(); if(p) p.catch(()=>{}); // 静音 + playsinline，不应被拦
    });
  });
  $('#pillMore').addEventListener('mouseleave', ()=>{
    stackEl.classList.remove('on');
    stackVids.forEach(v=>v.pause());            // 停在当前帧，再次 hover 接着播
  });
}

// 事件路径（composedPath）在派发那一刻就固定下来；而 e.target.closest() 是「现在才算的」：
// 胶囊自己的 click 处理会重写 innerHTML 换图标（eye / eye-off），把 e.target 那个 svg 从树上摘下来，
// 之后 closest 就找不到外面那层 button 了 —— 图标因此被当成「空白」，点一下就退出锁屏。
// 所以判断「点的是不是控件」一律走这里。
function inControl(e, sel){
  const path = e.composedPath ? e.composedPath() : [e.target];
  for(const el of path) if(el.nodeType === 1 && el.matches && el.matches(sel)) return true;
  return false;
}

// 锁屏是一层蒙布：Esc 或点任意非控件处都是「关闭锁屏 → 进桌面」（Windows 同款手势）
const LOCK_CONTROL = 'button, a, .rank-tile, .ops, #setMenu, #lockWidgets';
function dismissLock(){ if(state.screen === 'lock') setScreen('desktop'); }
$('#screenLock').addEventListener('click', e=>{
  // 右上操作区整块（含那圈看不见的安全边）都算控件：
  // 哪怕胶囊正处于隐身态，点它也只唤出操作区，不会掀掉锁屏
  if(inControl(e, LOCK_CONTROL)) return;
  dismissLock();
});

// 窗口外用 Esc 或点击桌面关闭（设计里没有关闭按钮，只给一个退出的手势）
addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  if(state.screen === 'lock'){ dismissLock(); return; }   // 锁屏上的 Esc 先关锁屏，不去动窗口
  closeApp();
});
$('#screenDesktop').addEventListener('click', e=>{
  if(state.appPhase === 'closed' || inControl(e, '.desk-app')) return;
  // 右上角入口与浮窗不属于「窗口外」：点它们不该把壁纸库窗口关掉
  // （同样不能用 e.target.closest：入口的 click 处理会换图标）
  if(inControl(e, '#deskToggle, #deskAssist')) return;
  // 系统托盘（G7FiM）是纯展示：点它不算「点窗口外」，不产生任何反馈
  if(inControl(e, '.tray')) return;
  closeApp();
});

// 排行榜（锁屏「热门壁纸」= #rankRow，桌面「排行榜」= #assistRank，两行六格）：
// 点哪一格 → 进该张壁纸自己的详情页（ia7Oi / appDetail）
['#rankRow','#assistRank'].forEach(sel=>{
  $(sel).addEventListener('click', e=>{
    const t = e.target.closest('[data-wall]'); if(t) openDetail(Number(t.dataset.wall));
  });
});

// BMgDr 今日精选 / B4A6oj 更多美图 → 退出锁屏、进入桌面，再唤起壁纸库客户端（yKmw8）
// 三拍：0ms 落在桌面（壁纸助手还在）→ 320ms 客户端启动页弹出 → 760ms 内容就位
const APP_BOOT = 320, APP_LOAD = 440;
let appTimers = [];
function clearAppTimers(){ appTimers.forEach(clearTimeout); appTimers = []; }
function openApp(view){
  if(typeof view === 'string') state.appView = view;   // 入口不同，落在窗口里的页也不同（点击事件对象不算）
  clearAppTimers();
  state.assist = false;                                  // 入口被点开时挂件收起，免得关窗后又弹出来
  state.assistPin = false;
  setScreen('desktop');                                  // 先看到桌面本身
  state.appPhase = 'closed'; render();
  appTimers.push(setTimeout(()=>{ state.appPhase = 'launching'; render(); }, APP_BOOT));
  appTimers.push(setTimeout(()=>{ state.appPhase = 'open';      render(); }, APP_BOOT + APP_LOAD));
}
function closeApp(){
  if(state.appPhase === 'closed') return;
  clearAppTimers();
  state.appPhase = 'closed';
  state.appView  = 'library';        // 下次再打开回到壁纸库首页，而不是停在上一张的详情
  state.assist   = false;            // 挂件回到「未展开」的默认态
  state.assistPin = false;           // 库页里钉住的浮窗一并取消
  render();
}
// 某一格热门壁纸 → 直接进它自己的详情页（而不是先落在壁纸库首页）
function openDetail(i){
  state.appWall = i;
  state.appView = 'detail';
  openApp();
}
$('#rankMore').addEventListener('click', openApp);
// TQO4T 壁纸频道：行本身不可点，只有「查看更多」胶囊 → 壁纸库
$('#assistMore').addEventListener('click', openApp);

// calendar
$('#calPrev').addEventListener('click', ()=>{ state.week--; renderCalendar(); });
$('#calNext').addEventListener('click', ()=>{ state.week++; renderCalendar(); });

// assistant controls
$('#aMute').addEventListener('click', ()=>{ state.muted = !state.muted; render();
  toast(state.muted ? '已静音' : '已取消静音'); });
$('#aVPause').addEventListener('click', ()=>{ state.videoPaused = !state.videoPaused; render();
  toast(state.videoPaused ? '视频已关闭' : '视频已开启'); });
$('#aStop').addEventListener('click', ()=>{ state.playing = !state.playing; render();
  toast(state.playing ? '轮播已继续' : '轮播已暂停'); });
// 壁纸轮播（XYyAA）：动态壁纸下在六张 MP4 里循环；关闭动态后只在九张静态壁纸里翻牌
// 上一张 / 下一张（Ai7Vr / UhJQV）不弹 toast —— 整屏壁纸当场就换了，提示只是噪声
// 上一张 / 下一张（Ai7Vr / UhJQV）不弹 toast —— 整屏壁纸当场就换了，提示只是噪声
function goDynamic(step, silent){
  if(!state.dynamic){                       // 静态壁纸：在九张静态壁纸里翻牌
    state.staticWall = (state.staticWall + step + STATIC_POOL.length) % STATIC_POOL.length;
    state.wall = STATIC_POOL[state.staticWall];
    render();
    if(!silent) toast(`当前壁纸 → ${staticAt(state.staticWall).name}`);
    return;
  }
  const k = RANK.indexOf(state.wall);
  const base = k < 0 ? (step > 0 ? -1 : 0) : k;
  go(RANK[(base + step + RANK.length) % RANK.length], silent);
}
$('#aPrev').addEventListener('click', ()=> goDynamic(-1, true));
$('#aNext').addEventListener('click', ()=> goDynamic(+1, true));
document.querySelectorAll('.a-sub button').forEach(b=>
  b.addEventListener('click', ()=>{
    if(b.dataset.act === 'dynamic'){            // 关闭 / 开启动态壁纸
      state.dynamic = !state.dynamic;
      if(state.dynamic){
        // 重新开启要**立即生效**：上一张若是静态壁纸（索引不在动态组里）
        // 就必须当场切到动态壁纸，否则画面还停在静态图上，看起来像没反应
        state.staticWall = 0;
        if(RANK.indexOf(state.wall) < 0) state.wall = RANK[0];
      }
      render();
      toast(state.dynamic ? '已开启动态壁纸' : '已关闭动态壁纸');   // 不加额外说明文字
      return;
    }
    if(b.dataset.act === 'setting'){ openApp('scroll'); return; }   // 设置壁纸轮播 → ius0K（hT1PW 那张图）
    if(b.dataset.act === 'lock'){ setScreen('lock'); return; }  // k2boA 唤起屏保 → 锁屏页
    toast(b.dataset.act);
  }));

/* ============ boot ============ */
renderCalendar();
renderRank();
const q = new URLSearchParams(location.search);
if(q.get('wall') !== null)                             // 深链：直接定位到某张壁纸
  state.wall = Math.min(WALLS.length-1, Math.max(0, Number(q.get('wall'))|0));
if(q.get('static') !== null){                          // 深链：直接看「已关闭动态壁纸」的静态壁纸态
  state.dynamic = false;
  state.staticWall = Math.min(STATIC_POOL.length-1, Math.max(0, Number(q.get('static'))|0));
}
render();
setScreen(q.get('s') === 'desktop' || location.hash === '#desktop' ? 'desktop' : 'lock');
if(q.get('app')) openApp(q.get('app') === '1' ? undefined : q.get('app'));  // 深链：直接走一遍客户端唤起（app=scroll 落在壁纸轮播设置）
if(q.get('detail') !== null)                          // 深链：直接进某张壁纸的详情页（ia7Oi）
  openDetail(Math.min(WALLS.length-1, Math.max(0, Number(q.get('detail'))|0)));
if(q.get('menu') === '1'){ menu.classList.add('on'); showOps(); }   // 深链：固定展开「设为 …」菜单（同时把操作区亮起）
if(q.get('assist') === '1'){ state.assist = true; state.assistPin = true; render(); }   // 深链：固定展开壁纸助手浮窗（llYsS / QNMlM / ia7Oi）

function fit(){
  const s = Math.min((innerWidth-64)/1600, (innerHeight-150)/1000);
  $('#stage').style.transform = `scale(${s})`;
}
addEventListener('resize', fit);
fit();
</script>
</body>
</html>
